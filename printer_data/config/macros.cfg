[gcode_macro PRINT_START]
gcode:
    # 1. 온도 시각화 효과 종료
    STOP_LED_EFFECTS LEDS="neopixel:frame_led"
    # 2. 인쇄용 화이트 조명 켜기
    #SET_LED_EFFECT EFFECT=progress_bar
    SET_LED_EFFECT EFFECT=heating_fire ; 가열효과 시작
    STOP_LED_EFFECTS LEDS="neopixel:frame_led"
    SET_LED_EFFECT EFFECT=printing_progress ; 출력 진행 표시 시작
    SET_LED_EFFECT EFFECT=lcd_printing
    # ... 주인님의 기존 호밍(G28) 및 시작 코드 ...

[gcode_macro PRINT_END]
gcode:
    # 1. 히터 끄기
    M140 S0
    M104 S0
    M106 S0 ; 팬 끄기
    # 2. 헤드 이동 (상대 좌표 사용)
    G91 ; 상대 좌표 모드
    G1 Z10 F3000 ; 노즐을 10mm 위로 올림
    G90 ; 절대 좌표 모드
    G1 X0 Y200 F3000 ; 베드를 앞으로 내밀고 헤드를 옆으로 치움 (Anet AM8 크기에 맞춰 조절)
    # 3. 모터 비활성화
    M84
    # 출력 완료 알림음 (도레미~ 같은 느낌)
    M300 S440 P200 # 라 (A4)
    M300 S660 P200 # 미 (E5)
    M300 S880 P500 # 라 (A5)
    # 4. 화이트 조명 끄기
    STOP_LED_EFFECTS LEDS="neopixel:frame_led"
    # 5. 다시 온도 시각화 효과 켜기 (노즐 식는 것 확인용)
#    SET_LED_EFFECT EFFECT=frame_temp_visual

[gcode_macro ALERT_BEEPER]
gcode:
    {% for i in range(3) %}
        M300 S1000 P500
        G4 P200
    {% endfor %}

[gcode_macro _KNOMI_STATUS]
variable_homing: False
variable_probing: False
variable_qgl: False
variable_heating_nozzle: False
variable_heating_bed: False
gcode:

[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
#    # KNOMI 애니메이션 시작
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
#    # 모든 인자(METHOD, ADAPTIVE 등)를 원래 명령어로 전달
    BTT_BED_MESH_CALIBRATE METHOD=rapid_scan {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}
#    # KNOMI 애니메이션 종료
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False


