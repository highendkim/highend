[gcode_macro CLEAN_NOZZLE_EXTREME]
gcode:
    {% set repeat_count = 5 %}       ; 전체 Y축 왕복 횟수 (주인님 요청대로 5회)
    
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90                              ; 절대 좌표
    
    # 1. 브러시 시작 위치 대기 (Z5, Y80)
    G1 Z5 F3000
    G1 X-12 Y80 F6000
    
    # 2. 클리닝 높이로 하강 (Z1.5)
    G1 Z0.5 F1500
    
    # 3. 5회 반복 루프 시작
    {% for i in range(repeat_count) %}
        # Y 80 -> 120 (X축 촘촘히 털기)
        G1 X-8  Y84  F12000
        G1 X-12 Y88  F12000
        G1 X-8  Y92  F12000
        G1 X-12 Y96  F12000
        G1 X-8  Y100 F12000
        G1 X-12 Y104 F12000
        G1 X-8  Y108 F12000
        G1 X-12 Y112 F12000
        G1 X-8  Y116 F12000
        G1 X-12 Y120 F12000
        
        # Y 120 -> 80 (복귀하면서 한 번 더!)
        G1 X-8  Y116 F12000
        G1 X-12 Y112 F12000
        G1 X-8  Y108 F12000
        G1 X-12 Y104 F12000
        G1 X-8  Y100 F12000
        G1 X-12 Y96  F12000
        G1 X-8  Y92  F12000
        G1 X-12 Y88  F12000
        G1 X-8  Y84  F12000
        G1 X-12 Y80  F12000
    {% endfor %}
    
    # 4. 마무리: 노즐을 번쩍 들어 올리기
    G1 Z15 F3000
    G1 X0 Y0 F6000                   ; 베드 중앙 근처로 이동 (선택)
    RESTORE_GCODE_STATE NAME=clean_nozzle_state

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set wipe_count = 10 %}        ; 왕복 횟수 설정
    
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90                             ; 절대 좌표 모드
    
    # 1. 브러시 근처 안전 위치로 이동 (Z 5mm 위)
    G1 Z5 F3000
    G1 X-10 Y80 F6000
    
    # 2. 클리닝 높이로 하강 (주인님 요청대로 Z 0.5mm 추천)
    G1 Z0.5 F1500                   ; 0mm는 브러시 손상 우려가 있어 0.5mm 추천
    
    # 3. 브러시 왕복 (지그재그 방식)
    {% for i in range(wipe_count) %}
        G1 X-12 Y120 F5000          ; 왼쪽 위로 이동
        G1 X-8  Y80  F5000          ; 오른쪽 아래로 이동
    {% endfor %}
    
    # 4. 마무리: 헤드 들어올리기
    G1 Z10 F3000
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    
[gcode_macro CLEAN_NOZZLE_INTENSE]
gcode:
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90                                ; 절대 좌표 모드
    
    # 1. 준비: 브러시 시작 지점 위로 이동 (Y 80, Z 5)
    G1 Z5 F3000
    G1 X-12 Y80 F6000
    
    # 2. 클리닝 높이 설정 (주인님 요청대로 Z 0.5mm 추천)
    G1 Z0.5 F1500
    
    # 3. Y축 80 -> 120 이동하는 동안 X축 10회 왕복 (총 20번의 가로지름)
    # Y축 속도를 늦추고 X축을 빠르게 움직여서 촘촘하게 닦습니다.
    G1 X-8  Y84  F8000
    G1 X-12 Y88  F8000
    G1 X-8  Y92  F8000
    G1 X-12 Y96  F8000
    G1 X-8  Y100 F8000
    G1 X-12 Y104 F8000
    G1 X-8  Y108 F8000
    G1 X-12 Y112 F8000
    G1 X-8  Y116 F8000
    G1 X-12 Y120 F8000
    
    # 4. 반대 방향 (Y축 120 -> 80)으로 내려오면서 한 번 더! (선택 사항)
    G1 X-8  Y116 F8000
    G1 X-12 Y112 F8000
    G1 X-8  Y108 F8000
    G1 X-12 Y104 F8000
    G1 X-8  Y100 F8000
    G1 X-12 Y96  F8000
    G1 X-8  Y92  F8000
    G1 X-12 Y88  F8000
    G1 X-8  Y84  F8000
    G1 X-12 Y80  F8000

    # 5. 마무리: 헤드 안전하게 들기
    G1 Z10 F3000
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    
[gcode_macro START_PRINT]
gcode:
    # 1. 온도 설정 (슬라이서 연동)
    {% set BED_TEMP = params.BED_TEMP|default(50)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|float %}

    M140 S{BED_TEMP}             ; 베드 가열 시작
    G90                          ; 절대 좌표
    G28                          ; 홈 잡기
 
    M190 S{BED_TEMP}             ; 베드 온도 대기
    M109 S{EXTRUDER_TEMP}        ; 노즐 온도 대기 (청소 전 완전 예열)

    BED_MESH_CALIBRATE ADAPTIVE=1

    # 2. [노즐 클리닝] - 쇠브러시 5회 왕복 실행
    CLEAN_NOZZLE_EXTREME

#    # 3. [프라이밍 라인 - 진짜로 2줄 긋기]
#    G1 Z5 F3000                  ; 안전 높이
#    G1 X2 Y20 F6000              ; 시작점 이동 (베드 왼쪽 앞)
#    G1 Z0.3 F1500                ; 인쇄 높이로 하강

    LINE_PURGE                     ; 출력물 시작점 바로 앞에서 퍼지 수행
    
#    G92 E0                       ; 익스트루더 초기화
#    # --- 첫 번째 줄 (Y 20 -> 150) ---
#    G1 X2 Y150 Z0.45 F1500 E20    ; 쭉 긋기 (0.6노즐이라 E20으로 넉넉히)
#    
#    # --- 옆으로 이동 ---
#    G1 X2.6 Y150 Z0.45 F5000      ; 0.6mm 옆으로 살짝 이동
#    
#    # --- 두 번째 줄 (Y 150 -> 20) ---
#    G1 X2.6 Y20 Z0.45 F1500 E40   ; 다시 내려오면서 압력 확실히 채우기
    
    # 4. 마무리 동작
    G92 E0                       ; 익스트루더 초기화
    G1 Z2.0 F3000                ; 노즐 들기
#    G1 X5 Y25 F5000              ; 찌꺼기 떼기 위해 살짝 옆으로 이동

[gcode_macro M80]
description: 전원 켜기
gcode: SET_PIN PIN=PS_ON VALUE=1

[gcode_macro M81]
description: 전원 끄기
gcode: SET_PIN PIN=PS_ON VALUE=0

[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %} # 주파수 (기본 1000Hz)
    {% set P = params.P|default(100)|int %}   # 지속 시간 (기본 100ms)
    SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=beeper VALUE=0

[gcode_macro POWER_OFF_AFTER_PRINT]
gcode:
    M117 Cooling down...
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=50 # 노즐 50도까지 대기
    M117 Powering off.
    M81 # 전원 차단

