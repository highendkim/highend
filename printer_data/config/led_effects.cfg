[neopixel frame_led]
pin: PE6
chain_count: 30
color_order: GRB
initial_RED: 0.1
initial_GREEN: 0.1
initial_BLUE: 0.1

[neopixel lcd_led]
pin: EXP1_6
chain_count: 3
color_order: BRG

initial_RED: 0.0
initial_GREEN: 0.5
initial_BLUE: 0.0

[neopixel nozzle_led]
pin: ebb36:PD3
chain_count: 1
color_order: GRB      # 대부분의 Neopixel은 GRB 순서입니다.
initial_RED: 1.0      # 시작 시 하얀색으로 켜지게 설정 (R+G+B)
initial_GREEN: 1.0
initial_BLUE: 1.0

