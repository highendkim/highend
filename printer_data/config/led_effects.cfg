# --- 프레임 LED: 노즐 온도에 따라 파랑->강렬한 빨강 (Marlin 스타일) ---
[led_effect panel_heating]
leds:
    neopixel:frame_led (1-30)
autostart:                          false
frame_rate:                         24
heater:                             extruder
layers:
    # 20도에서 255도 사이: Blue(0,0,1) -> Red(1,0,0)
    #heater  20 255 add (0,0,1),(1,0,0)
    heater 10 0 add (1,1,0),(1,0,0)
    #노란색에서 빨간색으로

# --- 프레임 LED: 인쇄 중에는 작업 시야를 위해 화이트 고정 ---
[led_effect frame_printing_white]
leds:
    neopixel:frame_led
autostart:                          false
frame_rate:                         24
layers:
    static  0 0 top (1.0, 1.0, 1.0)

# --- LCD LED: 주인님 요청대로 고정 색상 유지 ---
[led_effect lcd_fixed]
leds:
    neopixel:lcd_led
autostart:                          true
frame_rate:                         24
layers:
    static  0 0 top (0.0, 1.0, 0.0) # 현재 설정하신 녹색 고정

#아이들 상태에서 부드러운 레인보우
[led_effect idle_rainbow]
leds:
	neopixel:frame_led
autostart:		                	true
frame_rate:			                24
layers:
	gradient	0.3	1	add	(1,0,0),(0,1,0),(0,0,1)

[led_effect	progress_bar]
leds:
	neopixel:frame_led (1-30)
autostart:		                    false
frame_rate:			                24
layers:
	progress	-1	0	add	(0,1,0),(0, 0.3, 0) #진행된곳은 밝은 녹색, 나머지 어두운 녹색

[led_effect lcd_heartbeat]
leds:
	neopixel:lcd_led
autostart:			               false
frame_rate:			               24
layers:
	breathing	3	1	top	(0.5, 0, 0.5) #보라색 숨쉬기 효과

[led_effect startup_scan]
leds:
    neopixel:frame_led
autostart:                         false
frame_rate:                        24
layers:
    comet  0.5  2 add (0.8, 1.0, 1.0),(0, 0.8, 1.0) # 시안색 코멧 효과
    stepper 4 4 add (0, 0, 1) # 배경에 은은한 블루

[led_effect heating_fire]
leds:
    neopixel:frame_led
    neopixel:lcd_led
autostart:                          false
frame_rate:                         24
heater:                             extruder
layers:
    heater  20 0 add    (1, 0, 0),(1, 0.5, 0),(1, 1, 0) # 빨강 -> 주황 -> 노랑 화염

[led_effect victory_fanfare]
leds:
    neopixel:frame_led
    neopixel:lcd_led
autostart:                          false
frame_rate:                         24
layers:
    twinkle  5  0.5 add (1, 1, 1),(0, 1, 0) # 흰색과 녹색의 반짝임

[led_effect critical_error]
leds:
    neopixel:frame_led
    neopixel:lcd_led
autostart:                          false
frame_rate:                         24
run_on_error:                       true
layers:
    strobe  1  0.2 add (1, 0, 0) # 빠른 빨간색 깜빡임

