[output_pin PS_ON]
pin: PE4
value: 1
shutdown_value: 0

[gcode_button POWER_DET]
pin: ^!PC15
press_gcode:
  {action_respond_info("Power supply fault detected!")}
  TURN_OFF_HEATERS # 히터 끔
  SET_PIN PIN=PS_ON VALUE=0 # 전원끔
  M112             # 클리퍼 비상정지

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC1
position_endstop: -12
position_min: -12
position_max: 229
homing_speed: 100

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC3
position_endstop: -23
position_min: -23
position_max: 224
homing_speed: 100

[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^PC2
#position_endstop: 0
homing_speed: 4 # 10
second_homing_speed: 2
homing_retract_dist: 0
position_min: -3
position_max: 210

[stepper_z1]
