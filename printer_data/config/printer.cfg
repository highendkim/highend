[output_pin PS_ON]
pin: PE4
value: 1
shutdown_value: 0

[gcode_button POWER_DET]
pin: ^!PC15
press_gcode:
  {action_respond_info("Power supply fault detected!")}
  TURN_OFF_HEATERS # 히터 끔
  SET_PIN PIN=PS_ON VALUE=0 # 전원끔
  M112             # 클리퍼 비상정지

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC1
position_endstop: -12
position_min: -12
position_max: 229
homing_speed: 100

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC3
position_endstop: -23
position_min: -23
position_max: 224
homing_speed: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f
#reg_drive_current:16
#i2c_mcu: ebb36 ;for eddy coil
#i2c_software_sda_pin: ebb36:PB4 ;for eddy coil
#i2c_software_scl_pin: ebb36:PB3 ;for eddy coil
x_offset: -41.5
y_offset: -15.5
#samples: 1
#sample_retract_dist: 0.5
descend_z: 2.0

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

