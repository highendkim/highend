dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC1
position_endstop: -12
position_min: -12
position_max: 229
homing_speed: 100

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC3
position_endstop: -23
position_min: -23
position_max: 224
homing_speed: 100

[stepper_z]
