rotation_distance: 4.637
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: ebb36:PB13
sensor_type: MAX31865
sensor_pin: ebb36:PA4
spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2
min_temp: 0
max_temp: 300
max_extrude_only_distance: 101.0
pressure_advance: 0.020

[firmware_retraction]
retract_length: 1.0
retract_speed: 40
unretract_extra_length: 0.05
unretract_speed: 35

[stepper_z1]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
#control: pid
pwm_cycle_time: 0.01666
#pid_Kp: 19.66
#pid_Ki: 2.39
#pid_Kd: 107.98
min_temp: 0
max_temp: 140
smooth_time: 2.0

[heater_fan hotend_fan]
