[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2800
max_z_velocity: 15
max_z_accel: 50

[virtual_sdcard]
path: /home/highend/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[include mainsail.cfg]
[include fluidd.cfg]
[include macros.cfg]
[include timelapse.cfg]
[include led_effects.cfg]
[include OrbiterSensor.cfg]
[include shell_command.cfg]
[include autotune_tmc.cfg]
#[include shaketune.cfg]
[pause_resume]
[display_status]
[led_effect]
[exclude_object]

[output_pin PS_ON]
pin: PE4
value: 1
shutdown_value: 0

[gcode_button POWER_DET]
pin: ^!PC15
press_gcode:
  {action_respond_info("Power supply fault detected!")}
  TURN_OFF_HEATERS # 히터 끔
  SET_PIN PIN=PS_ON VALUE=0 # 전원끔
  M112             # 클리퍼 비상정지

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC1
position_endstop: -12
position_min: -12
position_max: 229
homing_speed: 100

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC3
position_endstop: -23
position_min: -23
position_max: 224
homing_speed: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: ebb36
i2c_software_sda_pin: ebb36:PB4
i2c_software_scl_pin: ebb36:PB3
x_offset: -41.5
y_offset: -15.5
samples: 1
sample_retract_dist: 0.5
descend_z: 2.0
z_offset: 0.05

[z_thermal_adjust]
temp_coeff: -0.00097
sensor_type: EPCOS 100K B57560G104F
sensor_pin: ebb36:PA3
min_temp: 0
max_temp: 100

[safe_z_home]
home_xy_position: 110, 110
speed: 100
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 150
horizontal_move_z: 2
mesh_min: 24,15
mesh_max: 187, 200
probe_count: 15, 15
algorithm: bicubic

[z_tilt]
z_positions:
    -76, 110  # 첫 번째 Z 모터(stepper_z)의 실제 물리적 좌표 (X, Y)
    297, 110  # 두 번째 Z 모터(stepper_z1)의 실제 물리적 좌표 (X, Y)
points:
    75, 125.5   # 수평 측정을 위해 프로브가 찍을 첫 번째 지점
    220, 125.5  # 프로브가 찍을 두 번째 지점
speed: 300
horizontal_move_z: 10
retries: 5           # 허용 오차 내로 들어올 때까지 재시도 횟수
retry_tolerance: 0.01 # 허용 오차 (mm)

