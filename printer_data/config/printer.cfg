[extruder]
step_pin: ebb36:PD0
dir_pin: ebb36:PD1
enable_pin: !ebb36:PD2
rotation_distance: 4.637
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: ebb36:PB13
sensor_type: MAX31865
sensor_pin: ebb36:PA4
spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2
min_temp: 0
max_temp: 300
max_extrude_only_distance: 101.0
pressure_advance: 0.020

[firmware_retraction]
retract_length: 1.0
retract_speed: 40
unretract_extra_length: 0.05
unretract_speed: 35

[stepper_z1]
step_pin: PD11
dir_pin: !PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 8

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
#control: pid
pwm_cycle_time: 0.01666
#pid_Kp: 19.66
#pid_Ki: 2.39
#pid_Kd: 107.98
min_temp: 0
max_temp: 140
smooth_time: 2.0

[heater_fan hotend_fan]
pin: ebb36:PA0
heater: extruder
heater_temp: 50.0

[fan]
pin: ebb36:PA1

[temperature_sensor btt_pi_2]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

# SKR_3_EZ 센서 항목은 삭제하거나 주석 처리하세요 (#)
# [temperature_sensor SKR_3_EZ]  <-- 이 부분이 있으면 충돌납니다.

[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: ebb36
min_temp: 0
max_temp: 100

[temperature_fan SKR_3_EZ]       # 이름을 센서 이름처럼 바꾸면 대시보드 보기가 더 편합니다.
pin: PB5
max_power: 1.0
kick_start_time: 0.5
min_speed: 0.5
sensor_type: temperature_mcu
sensor_mcu: mcu
target_temp: 45.0
min_temp: 0
max_temp: 100
off_below: 0.10      # 팬이 너무 낮은 전압에서 멈춰서 웅~ 소리만 나는 것을 방지합니다.
control: pid
pid_Kp: 40
pid_Ki: 0.2
pid_Kd: 0.1

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE9,  EXP1_7=PE11, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE8, EXP1_6=PE10, EXP1_8=PE12, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
contrast: 63
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[output_pin beeper]
pin: EXP1_1
pwm: True
value: 1.0
shutdown_value: 0
cycle_time: 0.001
scale: 1

