[output_pin PS_ON]
pin: PE4
value: 1
shutdown_value: 0

[gcode_button POWER_DET]
pin: ^!PC15
press_gcode:
  {action_respond_info("Power supply fault detected!")}
  TURN_OFF_HEATERS # 히터 끔
  SET_PIN PIN=PS_ON VALUE=0 # 전원끔
  M112             # 클리퍼 비상정지

[stepper_x]
